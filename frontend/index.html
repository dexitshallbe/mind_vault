<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mind Vault - Chat</title>

    <link rel="stylesheet" href="css/index.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-top">

            <div class="logo">
                <div class="logo-icon">M</div>
                <span>Mind Vault</span>
            </div>

            <button class="new-chat" id="newChatBtn">
                <span>＋</span>
                New chat
            </button>

        </div>


        <!-- NAVIGATION -->
        <nav class="navigation">

            <a href="index.html" class="nav-item active">
                <span>💬</span>
                Chat
            </a>

            <a href="#" class="nav-item">
                <span>📚</span>
                Notebooks
            </a>

            <a href="dashboard.html" class="nav-item">
                <span>📊</span>
                Dashboard
            </a>

            <a href="quiz.html" class="nav-item">
                <span>✏️</span>
                Quiz
            </a>

            <a href="flashcards.html" class="nav-item">
                <span>🗂️</span>
                Flashcards
            </a>

        </nav>


        <div class="sidebar-bottom">

            <button class="sidebar-option">
                ⚙️ Settings
            </button>

            <button class="sidebar-option">
                ❓ Help
            </button>

        </div>

    </aside>


    <!-- MAIN CHAT AREA -->
    <main class="chat-area">

        <!-- TOP BAR -->
        <header class="chat-header">

            <button class="mobile-menu" id="menuBtn">
                ☰
            </button>

            <div class="chat-title">
                <strong>Mind Vault</strong>
                <span>AI Study Assistant</span>
            </div>

        </header>


        <!-- MESSAGES -->
        <section class="messages" id="messages">

            <div class="welcome">

                <div class="welcome-icon">
                    M
                </div>

                <h1>How can I help you study?</h1>

                <p>
                    Ask questions, summarize your notes,
                    practice a topic, or explore your notebooks.
                </p>

            </div>

        </section>


        <!-- INPUT AREA -->
        <div class="input-area">

            <form id="chatForm" class="chat-form">

                <textarea
                    id="messageInput"
                    placeholder="Message Mind Vault..."
                    rows="1"
                    autocomplete="off"
                ></textarea>

                <button
                    type="submit"
                    id="sendButton"
                    class="send-button"
                    aria-label="Send message"
                >
                    ↑
                </button>

            </form>

            <p class="disclaimer">
                Mind Vault can make mistakes. Check important information.
            </p>

        </div>

    </main>

</div>


<script src="js/chat.js"></script>

</body>
</html>
