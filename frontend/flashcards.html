<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mind Vault - Flashcards</title>

    <link rel="stylesheet" href="css/flashcards.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">M</div>
            <span>Mind Vault</span>
        </div>

        <a href="index.html" class="nav-item">💬 Chat</a>
        <a href="#" class="nav-item">📚 Notebooks</a>
        <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="quiz.html" class="nav-item">✏️ Quiz</a>
        <a href="flashcards.html" class="nav-item active">🗂️ Flashcards</a>

    </aside>


    <main class="main-content">

        <header class="page-header">

            <button id="menuBtn" class="mobile-menu">
                ☰
            </button>

            <div>
                <h1>Flashcards</h1>
                <p>Review important concepts quickly.</p>
            </div>

        </header>


        <section class="flashcard-section">

            <div class="flashcard" id="flashcard">

                <span class="card-label">
                    Question
                </span>

                <h2 id="cardQuestion">
                    What is Retrieval-Augmented Generation?
                </h2>

                <p id="cardAnswer">
                    Click "Show Answer" to reveal the answer.
                </p>

            </div>


            <div class="controls">

                <button id="prevBtn">
                    ← Previous
                </button>

                <button id="showBtn">
                    Show Answer
                </button>

                <button id="nextBtn">
                    Next →
                </button>

            </div>

        </section>

    </main>

</div>

<script src="js/flashcards.js"></script>

</body>
</html>
