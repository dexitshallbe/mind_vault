<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mind Vault - Quiz</title>

    <link rel="stylesheet" href="css/quiz.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">M</div>
            <span>Mind Vault</span>
        </div>

        <a href="index.html" class="nav-item">💬 Chat</a>
        <a href="#" class="nav-item">📚 Notebooks</a>
        <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="quiz.html" class="nav-item active">✏️ Quiz</a>
        <a href="flashcards.html" class="nav-item">🗂️ Flashcards</a>

    </aside>


    <main class="main-content">

        <header class="page-header">

            <button id="menuBtn" class="mobile-menu">
                ☰
            </button>

            <div>
                <h1>Quiz</h1>
                <p>Test your knowledge with AI-generated questions.</p>
            </div>

        </header>


        <section class="practice-container">

            <div class="practice-intro">

                <h2>Ready to practice?</h2>

                <p>
                    Choose a topic and Mind Vault will generate
                    practice questions based on your study material.
                </p>

            </div>


            <div class="quiz-card">

                <div class="quiz-top">
                    <span>Question 1 of 5</span>
                    <span>Score: 0</span>
                </div>

                <h2>
                    What is the main purpose of an LLM?
                </h2>


                <div class="options">

                    <button class="option">
                        A. Store images
                    </button>

                    <button class="option">
                        B. Understand and generate text
                    </button>

                    <button class="option">
                        C. Manage hardware
                    </button>

                    <button class="option">
                        D. Create databases
                    </button>

                </div>

                <button id="nextBtn" class="next-btn">
                    Next Question
                </button>

            </div>

        </section>

    </main>

</div>

<script src="js/quiz.js"></script>

</body>
</html>
